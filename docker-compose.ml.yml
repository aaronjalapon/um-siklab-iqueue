# Full local ML inference override.
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.ml.yml up -d --build backend

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime-ml
    environment:
      - DEBUG=true
      - DEMO_MODE=true
      - REQUIRE_FORECAST_MODELS=true
      - FORECASTING_ARTIFACTS_DIR=/app/app/services/forecasting/artifacts
    volumes:
      - ./iqueue_artifacts/artifacts:/app/app/services/forecasting/artifacts:ro
      - ./evidence:/app/evidence:ro
